<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resident Settings | i-Sumbong</title>
  <link rel="stylesheet" href="styles/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="../theme.js"></script>
</head>
<body>
  <div class="layout">
    <header class="topbar">
      <div><p class="brand-title">i-Sumbong</p><p class="brand-subtitle">Resident settings</p></div>
      <div class="topbar-user">Juan Dela Cruz â€¢ Resident</div>
    </header>
    <aside class="sidebar">
      <nav class="nav-list">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="reports.html" class="nav-link">Reports</a>
        <a href="announcements.html" class="nav-link">Announcements</a>
        <a href="settings.html" class="nav-link active">Settings</a>
      </nav>
      <div class="nav-footer nav-list">
        <a href="../admin-dashboard/dashboard.html" class="nav-link">Open Staff View</a>
        <a href="../login-and-create-account/log-in.html" class="nav-link">Logout</a>
      </div>
    </aside>
    <main class="content">
      <section class="page-header">
        <p class="page-kicker">Settings</p>
        <h1>Basic account settings</h1>
        <p>This page keeps only simple input fields so it is easier to rebuild later.</p>
      </section>
      <section class="panel">
        <div class="panel-header">
          <div><p class="section-label">Account</p><h2>Resident information</h2></div>
        </div>
        <div class="form-grid">
          <div class="field">
            <label for="resident-name">Full Name</label>
            <input id="resident-name" type="text" value="Juan Dela Cruz" />
          </div>
          <div class="field">
            <label for="resident-email">Email</label>
            <input id="resident-email" type="email" value="juan.delacruz@isumbong.local" />
          </div>
          <div class="field">
            <label for="resident-contact">Contact Number</label>
            <input id="resident-contact" type="text" value="+63 912 345 6789" />
          </div>
        </div>
                  <div class="field" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel-soft); margin-top: 16px;">
            <label style="margin: 0;">Dark Theme</label>
            <label style="position: relative; display: inline-block; width: 40px; height: 24px;">
              <input type="checkbox" id="theme-toggle" onclick="toggleTheme()" style="opacity: 0; width: 0; height: 0;">
              <span style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; border-radius: 24px; transition: .4s; border: none; padding: 0;">
                <span class="slider-round" style="position: absolute; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%;"></span>
              </span>
            </label>
            <style>
              input:checked + span { background-color: var(--primary); }
              input:checked + span .slider-round { transform: translateX(16px); }
            </style>
            <script>
                // Make sure the toggle matches current state
                document.addEventListener('DOMContentLoaded', () => {
                    const toggle = document.getElementById('theme-toggle');
                    if (localStorage.getItem('theme') === 'dark') {
                        toggle.checked = true;
                    }
                });
            </script>
          </div>
        <div class="button-row">
          <a href="#" class="button">Save Changes</a>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
