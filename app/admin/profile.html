<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Profile | i-Sumbong</title>
  <link rel="stylesheet" href="styles/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0"
    rel="stylesheet" />
  <script src="../shared/theme.js"></script>
</head>

<body>
  <main class="window-shell">
    <section class="window-frame">
      <div class="window-toolbar">
        <div class="window-dot-group" aria-hidden="true">
          <span class="window-dot"></span><span class="window-dot"></span><span class="window-dot"></span>
        </div>
        <div class="window-title">
          <span class="material-symbols-outlined" aria-hidden="true">badge</span><span>Admin Profile Window</span>
        </div>
      </div>
      <div class="window-content">
        <header class="window-header">
          <p class="page-kicker">Profile</p>
          <h1>Admin profile</h1>
          <p class="window-note">Update the staff details and account information tied to your barangay dashboard access.</p>
        </header>
        <section class="window-section panel">
          <div class="panel-header">
            <div>
              <p class="section-label">Account</p>
              <h2>Edit staff information</h2>
            </div>
          </div>
          <div class="form-grid account-grid">
            <div class="field">
              <label for="admin-first-name">First Name</label>
              <input id="admin-first-name" type="text" value="Maria" />
            </div>
            <div class="field">
              <label for="admin-last-name">Last Name</label>
              <input id="admin-last-name" type="text" value="Lopez" />
            </div>
            <div class="field">
              <label for="admin-email">Email Address</label>
              <input id="admin-email" type="email" value="maria.lopez@isumbong.local" />
            </div>
            <div class="field">
              <label for="admin-contact">Mobile Number</label>
              <input id="admin-contact" type="text" value="+63 917 456 7821" />
            </div>
            <div class="field">
              <label for="admin-barangay">Barangay</label>
              <select id="admin-barangay">
                <option>Barangay Baybay</option>
                <option>Barangay Poblacion</option>
                <option>Barangay San Jose</option>
              </select>
            </div>
            <div class="field">
              <label for="admin-role">Account Type</label>
              <select id="admin-role">
                <option>Barangay Official</option>
                <option selected>Barangay Staff</option>
              </select>
            </div>
            <div class="field field-full">
              <label for="admin-address">Street Address or Landmark</label>
              <input id="admin-address" type="text" value="Municipal compound, main office beside the barangay hall" />
            </div>
            <div class="field">
              <label for="admin-password">Password</label>
              <input id="admin-password" type="password" value="AdminSecure123!" />
              <small>Use at least 8 characters if you want to change your password.</small>
            </div>
            <div class="field">
              <label for="admin-confirm-password">Confirm Password</label>
              <input id="admin-confirm-password" type="password" value="AdminSecure123!" />
            </div>
          </div>
          <div class="settings-checkboxes">
            <label class="settings-check" for="admin-terms">
              <input type="checkbox" id="admin-terms" checked>
              <span>I agree to the Terms and Privacy Policy for my i-Sumbong account.</span>
            </label>
            <label class="settings-check" for="admin-updates">
              <input type="checkbox" id="admin-updates">
              <span>I want to receive important account and report-related updates through the platform.</span>
            </label>
          </div>
          <div class="button-row">
            <a href="#" class="button">Save Profile Changes</a>
            <a href="dashboard.html" class="button-secondary" onclick="window.close(); return false;"><span
                class="material-symbols-outlined" aria-hidden="true">close</span><span>Close Window</span></a>
          </div>
        </section>
      </div>
    </section>
  </main>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (localStorage.getItem("theme") === "dark") {
        document.documentElement.classList.add("dark-theme");
      }
    });
  </script>
</body>

</html>
